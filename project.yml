name: WrenchTime
options:
  bundleIdPrefix: com.wrenchtime
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

schemes:
  WrenchTime:
    build:
      targets:
        WrenchTime: all
    run:
      config: Debug
      storeKitConfiguration: ../WrenchTime/StoreKit/WrenchTime.storekit
    test:
      config: Debug
      targets:
        - WrenchTimeTests

targets:
  WrenchTime:
    type: application
    platform: iOS
    sources:
      - path: WrenchTime
        excludes:
          - "**/*.storekit"
    settings:
      base:
        INFOPLIST_FILE: WrenchTime/App/Info.plist
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: WrenchTime
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_EMIT_LOC_STRINGS: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.wrenchtime.app
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: WrenchTime/App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.wrenchtime.oauth
            CFBundleURLSchemes:
              - wrenchtime
        LSApplicationQueriesSchemes:
          - strava

  WrenchTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WrenchTimeTests
    dependencies:
      - target: WrenchTime
