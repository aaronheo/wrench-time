services:
  - type: web
    name: wrench-time-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://vsrdpobeockdyfwjkloi.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
